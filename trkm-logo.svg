<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Background blob -->
  <ellipse cx="200" cy="200" rx="180" ry="160" fill="#f0f4f8"/>
  
  <!-- Books stack -->
  <!-- Bottom book -->
  <rect x="80" y="280" width="240" height="50" rx="8" fill="#2d3a66"/>
  <rect x="80" y="280" width="50" height="50" rx="8" fill="#1a2540"/>
  
  <!-- Middle book -->
  <rect x="90" y="225" width="220" height="45" rx="6" fill="#4a5a8a"/>
  <rect x="90" y="225" width="45" height="45" rx="6" fill="#2d3a66"/>
  
  <!-- Top book -->
  <rect x="100" y="175" width="200" height="40" rx="5" fill="#6b7aa3"/>
  <rect x="100" y="175" width="40" height="40" rx="5" fill="#4a5a8a"/>
  
  <!-- Ladder -->
  <line x1="120" y1="330" x2="160" y2="175" stroke="#8b7fd9" stroke-width="6" stroke-linecap="round"/>
  <line x1="140" y1="330" x2="180" y2="175" stroke="#8b7fd9" stroke-width="6" stroke-linecap="round"/>
  <!-- Ladder rungs -->
  <line x1="125" y1="300" x2="155" y2="300" stroke="#8b7fd9" stroke-width="4" stroke-linecap="round"/>
  <line x1="132" y1="260" x2="162" y2="260" stroke="#8b7fd9" stroke-width="4" stroke-linecap="round"/>
  <line x1="139" y1="220" x2="169" y2="220" stroke="#8b7fd9" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Person -->
  <!-- Body -->
  <ellipse cx="200" cy="165" rx="45" ry="35" fill="#ff6b9d"/>
  <!-- Head -->
  <circle cx="200" cy="130" r="18" fill="#f4c2a1"/>
  <!-- Arms -->
  <path d="M165 160 Q140 170 155 185" stroke="#ff6b9d" stroke-width="20" stroke-linecap="round" fill="none"/>
  <path d="M235 160 Q260 170 245 175" stroke="#ff6b9d" stroke-width="20" stroke-linecap="round" fill="none"/>
  <!-- Legs -->
  <rect x="185" y="195" width="12" height="50" rx="3" fill="#4a3050"/>
  <rect x="203" y="195" width="12" height="50" rx="3" fill="#4a3050"/>
  
  <!-- Flag pole -->
  <line x1="245" y1="245" x2="245" y2="100" stroke="#2d3a66" stroke-width="4"/>
  <!-- Flag -->
  <path d="M245 110 Q280 100 300 115 Q320 130 300 145 Q280 160 245 150" fill="#ff8c42"/>
  
  <!-- Decorative elements -->
  <ellipse cx="300" cy="200" rx="35" ry="50" fill="#ffb347" opacity="0.8"/>
  <ellipse cx="340" cy="260" rx="25" ry="35" fill="#ff69b4" opacity="0.6"/>
  
  <!-- Graduation cap circle -->
  <circle cx="320" cy="320" r="45" fill="#9b8fd9" opacity="0.9"/>
  <!-- Graduation cap -->
  <path d="M295 310 L320 295 L345 310 L320 325 Z" fill="white"/>
  <rect x="318" y="325" width="4" height="15" fill="white"/>
  <circle cx="335" cy="305" r="5" fill="white"/>
</svg>
